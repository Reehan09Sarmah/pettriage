[project]
name = "pettriage"
version = "0.1.0"
description = "Pet health symptom triage — ML system with feedback loop"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/pettriage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
